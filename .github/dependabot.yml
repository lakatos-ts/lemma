version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Bundle every non-breaking update (dependencies + devDependencies)
    # into a single grouped PR.
    groups:
      vitest:
        applies-to: version-updates
        patterns:
          - "vitest"
          - "@vitest/*"
        update-types:
          - "major"
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    # Other major bumps are deliberately left out of the groups, so
    # Dependabot opens a separate PR for each one for individual review.

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Bundle all GitHub Actions version bumps into a single grouped PR.
    groups:
      actions:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    # As with npm, major action bumps get their own PRs for individual review.
